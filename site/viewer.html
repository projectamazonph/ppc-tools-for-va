<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Loading... - PPC Tools for VAs</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    .md-viewer {
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
    }
    .md-viewer h1 { font-family: 'Manrope', sans-serif; font-size: 2.5rem; font-weight: 800; margin-bottom: 1rem; color: #101820; }
    .md-viewer h2 { font-family: 'Manrope', sans-serif; font-size: 1.75rem; font-weight: 700; margin: 2rem 0 1rem; color: #101820; border-bottom: 2px solid #FF6B35; padding-bottom: 0.5rem; }
    .md-viewer h3 { font-family: 'Manrope', sans-serif; font-size: 1.25rem; font-weight: 600; margin: 1.5rem 0 0.5rem; color: #2d3748; }
    .md-viewer p { line-height: 1.7; margin: 1rem 0; color: #4a5568; font-size: 1rem; }
    .md-viewer ul, .md-viewer ol { margin: 1rem 0; padding-left: 1.5rem; }
    .md-viewer li { margin: 0.5rem 0; line-height: 1.6; color: #4a5568; }
    .md-viewer code { background: #f7fafc; padding: 0.2rem 0.4rem; border-radius: 4px; font-family: 'SF Mono', monospace; font-size: 0.9em; color: #e53e3e; }
    .md-viewer pre { background: #1a202c; color: #e2e8f0; padding: 1.5rem; border-radius: 8px; overflow-x: auto; margin: 1.5rem 0; }
    .md-viewer pre code { background: none; padding: 0; color: #e2e8f0; }
    .md-viewer blockquote { border-left: 4px solid #FF6B35; padding-left: 1rem; margin: 1.5rem 0; font-style: italic; color: #718096; }
    .md-viewer table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; }
    .md-viewer th, .md-viewer td { border: 1px solid #e2e8f0; padding: 0.75rem; text-align: left; }
    .md-viewer th { background: #f7fafc; font-weight: 600; }
    .md-viewer a { color: #FF6B35; text-decoration: none; }
    .md-viewer a:hover { text-decoration: underline; }
    .md-viewer hr { border: none; border-top: 2px solid #e2e8f0; margin: 2rem 0; }
    .md-viewer img { max-width: 100%; height: auto; border-radius: 8px; margin: 1rem 0; }
    .breadcrumb { padding: 1rem 2rem; background: #f7fafc; border-bottom: 1px solid #e2e8f0; }
    .breadcrumb a { color: #FF6B35; text-decoration: none; }
    .breadcrumb a:hover { text-decoration: underline; }
    .error { background: #fed7d7; color: #c53030; padding: 1rem; border-radius: 8px; margin: 2rem; }
  </style>
</head>
<body>
<header><a class="brand" href="index.html"><span>PPC <em>Tools</em><small>for Virtual Assistants</small></span></a><nav><a href="index.html">Home</a></nav></header>
<div class="breadcrumb"><a href="index.html">Home</a> / <span id="doc-title">Loading...</span></div>
<main>
  <div id="content" class="md-viewer">
    <p>Loading content...</p>
  </div>
</main>
<footer><p>&copy; 2026 Ryan Roland Dabao. MIT licensed.</p></footer>
<script>
  const params = new URLSearchParams(window.location.search);
  const file = params.get('file');
  
  if (!file) {
    document.getElementById('content').innerHTML = '<div class="error">No file specified. Use ?file=filename.md</div>';
  } else {
    const url = 'https://raw.githubusercontent.com/projectamazonph/ppc-tools-for-va/main/' + file;
    
    fetch(url)
      .then(response => {
        if (!response.ok) throw new Error('File not found');
        return response.text();
      })
      .then(markdown => {
        document.getElementById('content').innerHTML = marked.parse(markdown);
        const title = document.querySelector('#content h1');
        document.getElementById('doc-title').textContent = title ? title.textContent : file;
        document.title = (title ? title.textContent : file) + ' - PPC Tools for VAs';
      })
      .catch(err => {
        document.getElementById('content').innerHTML = '<div class="error">Error loading content: ' + err.message + '</div>';
      });
  }
</script>
</body>
</html>
