<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Loading... - PPC Tools for VAs</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --primary: #FF6B35;
      --primary-dark: #e55a2b;
      --success: #10B981;
      --warning: #F59E0B;
      --danger: #EF4444;
      --surface: #ffffff;
      --surface-alt: #F7FAFC;
      --text: #1A202C;
      --text-muted: #718096;
      --border: #E2E8F0;
    }

    * { box-sizing: border-box; }

    body {
      background: var(--surface-alt);
      min-height: 100vh;
      margin: 0;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .quiz-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .quiz-header h1 {
      font-family: 'Manrope', sans-serif;
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--text);
      margin: 0 0 0.5rem 0;
    }

    .quiz-header p {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin: 0;
    }

    .level-tabs {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 2rem;
      padding: 1rem;
      background: var(--surface);
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .level-tab {
      padding: 0.75rem 1.5rem;
      border: none;
      background: var(--surface-alt);
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .level-tab:hover {
      background: var(--border);
    }

    .level-tab.active {
      background: var(--primary);
      color: white;
    }

    .quiz-progress {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
      padding: 1rem;
      background: var(--surface);
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .progress-bar {
      flex: 1;
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--primary-dark));
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    .progress-text {
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
    }

    .question-card {
      background: var(--surface);
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .question-number {
      display: inline-block;
      background: var(--primary);
      color: white;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      margin-bottom: 1rem;
    }

    .question-text {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .option {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.25rem;
      background: var(--surface-alt);
      border: 2px solid transparent;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .option:hover {
      border-color: var(--primary);
      background: #FFF5F0;
    }

    .option.selected {
      border-color: var(--primary);
      background: #FFF5F0;
    }

    .option.correct {
      border-color: var(--success);
      background: #ECFDF5;
    }

    .option.incorrect {
      border-color: var(--danger);
      background: #FEF2F2;
    }

    .option-marker {
      width: 28px;
      height: 28px;
      border: 2px solid var(--border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: var(--text-muted);
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .option.selected .option-marker {
      border-color: var(--primary);
      background: var(--primary);
      color: white;
    }

    .option.correct .option-marker {
      border-color: var(--success);
      background: var(--success);
      color: white;
    }

    .option.incorrect .option-marker {
      border-color: var(--danger);
      background: var(--danger);
      color: white;
    }

    .option-text {
      color: var(--text);
      font-size: 1rem;
    }

    .explanation {
      margin-top: 1rem;
      padding: 1rem;
      background: #FFFBEB;
      border-left: 4px solid var(--warning);
      border-radius: 0 8px 8px 0;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .explanation-title {
      font-weight: 700;
      color: var(--warning);
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .explanation-text {
      color: var(--text);
      line-height: 1.6;
      margin: 0;
    }

    .quiz-nav {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin-top: 2rem;
    }

    .quiz-btn {
      padding: 1rem 2rem;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .quiz-btn.primary {
      background: var(--primary);
      color: white;
    }

    .quiz-btn.primary:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255,107,53,0.3);
    }

    .quiz-btn.secondary {
      background: var(--surface-alt);
      color: var(--text);
    }

    .quiz-btn.secondary:hover {
      background: var(--border);
    }

    .quiz-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .results-card {
      text-align: center;
      padding: 3rem 2rem;
      background: var(--surface);
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }

    .results-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
    }

    .results-score {
      font-family: 'Manrope', sans-serif;
      font-size: 3rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 0.5rem;
    }

    .results-message {
      font-size: 1.25rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    .results-details {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .result-stat {
      padding: 1rem;
      background: var(--surface-alt);
      border-radius: 10px;
    }

    .result-stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
    }

    .result-stat-label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .breadcrumb { padding: 1rem 2rem; background: var(--surface); border-bottom: 1px solid var(--border); }
    .breadcrumb a { color: var(--primary); text-decoration: none; }
    .breadcrumb a:hover { text-decoration: underline; }
    .error { background: #FEF2F2; color: #DC2626; padding: 1rem; border-radius: 8px; margin: 2rem; }
    footer { text-align: center; padding: 2rem; color: var(--text-muted); }

    @media (max-width: 600px) {
      .level-tabs { padding: 0.75rem; gap: 0.5rem; }
      .level-tab { padding: 0.5rem 1rem; font-size: 0.85rem; }
      .question-card { padding: 1.5rem; }
      .results-details { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<header><a class="brand" href="index.html"><span>PPC <em>Tools</em><small>for Virtual Assistants</small></span></a><nav><a href="index.html">Home</a></nav></header>
<div class="breadcrumb"><a href="index.html">Home</a> / <span id="doc-title">Loading...</span></div>

<div class="quiz-container" id="quiz-app">
  <p>Loading quiz...</p>
</div>

<footer><p>&copy; 2026 Ryan Roland Dabao. MIT licensed.</p></footer>

<script>
const LEVELS = {
  'all': { name: 'All Questions', filter: () => true },
  'beginner': { name: 'Beginner', filter: (q) => q.level === 1 },
  'intermediate': { name: 'Intermediate', filter: (q) => q.level === 2 },
  'advanced': { name: 'Advanced', filter: (q) => q.level === 3 },
  'expert': { name: 'Expert', filter: (q) => q.level === 4 },
  'scenario': { name: 'Scenario-Based', filter: (q) => q.level === 5 }
};

let questions = [];
let currentLevel = 'beginner';
let currentIndex = 0;
let answers = {};
let quizData = null;

function parseQuiz(markdown) {
  const lines = markdown.split('\n');
  const questions = [];
  let currentQ = null;

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();

    // Detect question level headers
    if (line.match(/^##?\s*Level\s*1/i) || line.includes('Beginner')) {
      continue;
    }
    if (line.match(/^##?\s*Q\d+/)) {
      if (currentQ) questions.push(currentQ);
      const numMatch = line.match(/Q(\d+)/);
      currentQ = {
        number: numMatch ? parseInt(numMatch[1]) : questions.length + 1,
        text: '',
        options: [],
        answer: 0,
        explanation: '',
        level: 1
      };
    } else if (currentQ) {
      if (line.match(/^[A-D]\.\s+/)) {
        currentQ.options.push(line.replace(/^[A-D]\.\s+/, '').trim());
      } else if (line.toLowerCase().includes('answer:') || line.toLowerCase().includes('**answer**')) {
        const ansMatch = line.match(/([A-D])/i);
        if (ansMatch) currentQ.answer = ansMatch[1].toUpperCase().charCodeAt(0) - 65;
      } else if (line.toLowerCase().includes('explanation:') || line.includes('**Explanation**')) {
        currentQ.explanation = line.replace(/^[A-D]\.\s+/i, '').replace(/explanation:?/i, '').replace(/\*\*/g, '').trim();
      } else if (line && !line.startsWith('>') && !line.startsWith('#') && currentQ.options.length > 0) {
        currentQ.explanation += ' ' + line;
      } else if (line && !line.startsWith('#') && !line.startsWith('>') && currentQ.options.length === 0) {
        currentQ.text += (currentQ.text ? ' ' : '') + line;
      }
    }
  }
  if (currentQ) questions.push(currentQ);
  return questions;
}

function renderQuiz() {
  const filtered = questions.filter(LEVELS[currentLevel].filter);
  const app = document.getElementById('quiz-app');

  if (filtered.length === 0) {
    app.innerHTML = `<div class="error">No questions found for this level.</div>`;
    return;
  }

  const totalAnswered = Object.keys(answers).filter(k => answers[k] !== null).length;
  const currentQ = filtered[currentIndex];

  let html = `
    <div class="quiz-header">
      <h1>${LEVELS[currentLevel].name}</h1>
      <p>${filtered.length} questions</p>
    </div>

    <div class="level-tabs">
      ${Object.entries(LEVELS).map(([key, val]) => `
        <button class="level-tab ${currentLevel === key ? 'active' : ''}" onclick="setLevel('${key}')">${val.name}</button>
      `).join('')}
    </div>

    <div class="quiz-progress">
      <span class="progress-text">Question ${currentIndex + 1} of ${filtered.length}</span>
      <div class="progress-bar">
        <div class="progress-fill" style="width: ${((currentIndex + 1) / filtered.length) * 100}%"></div>
      </div>
    </div>

    <div class="question-card">
      <span class="question-number">Q${currentQ.number}</span>
      <div class="question-text">${currentQ.text}</div>
      <div class="options">
        ${currentQ.options.map((opt, i) => {
          const isSelected = answers[currentQ.number] === i;
          const isAnswered = answers[currentQ.number] !== undefined;
          const isCorrect = i === currentQ.answer;
          let classes = 'option';
          if (isSelected) classes += ' selected';
          if (isAnswered && isCorrect) classes += ' correct';
          if (isAnswered && isSelected && !isCorrect) classes += ' incorrect';

          return `<div class="${classes}" onclick="selectOption(${currentQ.number}, ${i})">
            <span class="option-marker">${String.fromCharCode(65 + i)}</span>
            <span class="option-text">${opt}</span>
          </div>`;
        }).join('')}
      </div>
      ${answers[currentQ.number] !== undefined && currentQ.explanation ? `
        <div class="explanation">
          <div class="explanation-title">💡 Explanation</div>
          <p class="explanation-text">${currentQ.explanation}</p>
        </div>
      ` : ''}
    </div>

    <div class="quiz-nav">
      <button class="quiz-btn secondary" onclick="prevQuestion()" ${currentIndex === 0 ? 'disabled' : ''}>← Previous</button>
      ${currentIndex < filtered.length - 1 ?
        `<button class="quiz-btn primary" onclick="nextQuestion()">Next →</button>` :
        `<button class="quiz-btn primary" onclick="showResults()">See Results →</button>`
      }
    </div>
  `;

  app.innerHTML = html;
}

function setLevel(level) {
  currentLevel = level;
  currentIndex = 0;
  renderQuiz();
}

function selectOption(qNum, optionIndex) {
  if (answers[qNum] !== undefined) return;
  answers[qNum] = optionIndex;
  renderQuiz();
}

function nextQuestion() {
  const filtered = questions.filter(LEVELS[currentLevel].filter);
  if (currentIndex < filtered.length - 1) {
    currentIndex++;
    renderQuiz();
  }
}

function prevQuestion() {
  if (currentIndex > 0) {
    currentIndex--;
    renderQuiz();
  }
}

function showResults() {
  const filtered = questions.filter(LEVELS[currentLevel].filter);
  const answered = filtered.filter(q => answers[q.number] !== undefined);
  const correct = answered.filter(q => answers[q.number] === q.answer).length;

  const percentage = answered.length > 0 ? Math.round((correct / answered.length) * 100) : 0;

  let emoji, message;
  if (percentage >= 90) { emoji = '🎉'; message = 'Excellent! You\'re ready for the next level!'; }
  else if (percentage >= 70) { emoji = '👍'; message = 'Good job! Keep practicing to improve.'; }
  else if (percentage >= 50) { emoji = '📚'; message = 'Not bad! Review the explanations and try again.'; }
  else { emoji = '💪'; message = 'Keep learning! You\'ll get better with practice.'; }

  document.getElementById('quiz-app').innerHTML = `
    <div class="results-card">
      <div class="results-icon">${emoji}</div>
      <div class="results-score">${percentage}%</div>
      <div class="results-message">${message}</div>
      <div class="results-details">
        <div class="result-stat">
          <div class="result-stat-value">${answered.length}</div>
          <div class="result-stat-label">Answered</div>
        </div>
        <div class="result-stat">
          <div class="result-stat-value" style="color: var(--success)">${correct}</div>
          <div class="result-stat-label">Correct</div>
        </div>
        <div class="result-stat">
          <div class="result-stat-value" style="color: var(--danger)">${answered.length - correct}</div>
          <div class="result-stat-label">Incorrect</div>
        </div>
      </div>
      <button class="quiz-btn primary" onclick="resetQuiz()">Try Again</button>
    </div>
  `;
}

function resetQuiz() {
  answers = {};
  currentIndex = 0;
  renderQuiz();
}

const params = new URLSearchParams(window.location.search);
const file = params.get('file');

if (!file) {
  document.getElementById('quiz-app').innerHTML = '<div class="error">No file specified. Use ?file=filename.md</div>';
} else if (!file.includes('quizzes')) {
  // Non-quiz files - use simple viewer
  const url = 'https://raw.githubusercontent.com/projectamazonph/ppc-tools-for-va/main/' + file;
  fetch(url)
    .then(r => r.text())
    .then(md => {
      document.getElementById('quiz-app').innerHTML = `<div class="question-card" style="max-width:800px;margin:2rem auto;">
        ${marked.parse(md)}
      </div>`;
      document.getElementById('doc-title').textContent = file.split('/').pop().replace('.md','');
    });
} else {
  const url = 'https://raw.githubusercontent.com/projectamazonph/ppc-tools-for-va/main/' + file;
  fetch(url)
    .then(r => r.text())
    .then(md => {
      questions = parseQuiz(md);
      document.getElementById('doc-title').textContent = 'Knowledge Quiz';
      document.title = 'Knowledge Quiz - PPC Tools for VAs';
      renderQuiz();
    })
    .catch(err => {
      document.getElementById('quiz-app').innerHTML = '<div class="error">Error loading quiz: ' + err.message + '</div>';
    });
}
</script>
</body>
</html>
